# Packaging for Windows 10/11 and macOS, as VC Writer and VC Game Studio
# package. Signing credentials come from CI secrets and are never in the
# repository; see docs/DEPLOYMENT.md.
appId: com.vcdit.desktop
productName: VC DIT
copyright: Copyright © VC DIT

directories:
  output: release
  buildResources: build

# 1024 px PNGs drawn by scripts/icons.mjs; electron-builder derives .ico and .icns.
icon: build/icon.png

files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json

# Installers go to the private releases bucket (apps/web/scripts/publish-release.mjs)
# and are handed out as short-lived signed URLs; electron-builder publishes nothing.
publish: null

# FFmpeg (scripts/fetch-ffmpeg.mjs puts it in build/ffmpeg) and the burn-in
# font travel as resources beside the app, outside the asar archive, so they
# can be run and read as plain files.
win:
  extraResources:
    - from: build/ffmpeg/win32-x64
      to: ffmpeg/win32-x64
      filter: ['**/*', '!.sha256']
    - from: build/fonts
      to: fonts
  target:
    - target: nsis
      arch: [x64]
  signingHashAlgorithms: [sha256]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  artifactName: VC-DIT-Setup-${version}.${ext}

mac:
  icon: build/icon-mac.png
  # Both FFmpeg builds ship in the universal app; the running Mac picks its own.
  extraResources:
    - from: build/ffmpeg/darwin-arm64
      to: ffmpeg/darwin-arm64
      filter: ['**/*', '!.sha256']
    - from: build/ffmpeg/darwin-x64
      to: ffmpeg/darwin-x64
      filter: ['**/*', '!.sha256']
    - from: build/fonts
      to: fonts
  x64ArchFiles: Contents/Resources/ffmpeg/**
  category: public.app-category.video
  target:
    - target: dmg
      arch: [universal]
  minimumSystemVersion: '11.0'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  artifactName: VC-DIT-${version}.${ext}

# Notarization is switched on from the command line (-c.mac.notarize=true) only
# when Apple credentials are present, so an unsigned test build still works.
